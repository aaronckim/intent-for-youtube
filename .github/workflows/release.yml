# Push a tag like v0.1.1 (matching extension/manifest.json) to test, package, create a GitHub
# release with the zip, and submit it to the Chrome Web Store. Store submission is skipped until
# the CWS_* secrets exist (the first version has to be uploaded by hand to create the item).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi
          echo "ZIP=dist/intent-$version.zip" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run e2e
      - run: npm run package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
      - name: Submit to the Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/publish-cws.mjs "$ZIP"
